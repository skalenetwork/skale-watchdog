[project]
name = "skale-watchdog"
version = "4.1.0"
requires-python = ">=3.14"
dependencies = [
    "Flask==3.1.3",
    "granian==2.8.8",
    "requests==2.34.2",
    "skale.py-core==8.0dev0",
]

[project.optional-dependencies]
dev = ["ruff==0.17.5", "mypy==2.4.1"]
test = ["pytest==9.2.0"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["main.py", "settings.py", "health.py", "tests", "watchdog_client"]
