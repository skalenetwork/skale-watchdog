[project]
name = "skale-watchdog"
version = "3.1.0"
requires-python = ">=3.13"
dependencies = [
    "Flask==3.1.2",
    "Jinja2==3.1.6",
    "uwsgi==2.0.30",
    "requests==2.32.5",
    "itsdangerous==2.2.0",
]

[project.optional-dependencies]
dev = ["ruff==0.14.0", "mypy==1.18.2", "types-requests==2.32.4.20250913"]
test = ["pytest==8.4.2", "pytest-cov==7.0.0"]

[tool.ruff]
line-length = 100
exclude = ["helper-scripts", "hardhat-node"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
ignore_missing_imports = true
# todo: uncomment when types are added to all modules
# warn_return_any = true
# disallow_untyped_defs = true

[tool.pytest.ini_options]
log_cli = false
log_cli_level = "INFO"
log_cli_format = "[%(asctime)s] [%(levelname)8s] [%(threadName)s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
filterwarnings = ["ignore::DeprecationWarning"]
