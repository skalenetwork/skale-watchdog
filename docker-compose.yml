services:
  nginx:
    image: nginx:1.30.6
    network_mode: host
    depends_on:
      - watchdog
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  watchdog:
    build: .
    network_mode: host
    stop_grace_period: 30s
    volumes:
      - ./tests/settings:/settings:ro
    environment:
      UPSTREAM_PORT: 3107
      REFRESH_INTERVAL: 10
      LOG_LEVEL: DEBUG
