services:
  nginx:
    image: nginx:1.29.5
    container_name: skale_nginx
    network_mode: host
    depends_on:
      - watchdog
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  watchdog:
    container_name: skale_watchdog
    image: "skale-watchdog:local"
    build:
      context: "."
      dockerfile: Dockerfile
    network_mode: host
    cpus: "0.5"
    stop_grace_period: 30s
    volumes:
      - ./tests/settings:/settings:ro
    environment:
      UPSTREAM_PORT: ${UPSTREAM_PORT:-3107}
      REFRESH_INTERVAL: ${REFRESH_INTERVAL:-10}
      LOG_LEVEL: DEBUG
