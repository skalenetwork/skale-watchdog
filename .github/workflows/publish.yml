name: Publish
on:
  pull_request:
    types: [closed]
    branches: [develop, beta, stable]

permissions: {}

jobs:
  version:
    if: github.event.pull_request.merged
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      pep440: ${{ steps.version.outputs.pep440 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - id: version
        env:
          BRANCH: ${{ github.event.pull_request.base.ref }}
        run: scripts/version.sh >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ steps.version.outputs.tag }}"
          --target "${{ github.event.pull_request.merge_commit_sha }}"
          --prerelease=${{ github.event.pull_request.base.ref != 'stable' }}
          --generate-notes

  pypi:
    needs: version
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: astral-sh/setup-uv@v10.0.1
      - working-directory: watchdog_client
        run: |
          uv version --frozen "${{ needs.version.outputs.pep440 }}"
          uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: watchdog_client/dist

  docker:
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: skalenetwork/watchdog:${{ needs.version.outputs.tag }}
          provenance: true
          sbom: true
