name: Test
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: 3.13
      - name: Install docker-compose and libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libmysqlclient-dev build-essential docker-compose
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install python dependencies
        run: |
          uv sync --prerelease=allow --all-extras
          uv run pip install codecov pytest-cov
      - name: Checking formatting with ruff
        run: uv run ruff check
      - name: Mypy check
        run: uv run mypy .
      - name: Run unit tests
        run: |
          scripts/run_unit_tests.sh
      - name: Run comprehensive test
        run: |
          scripts/run_comprehensive_test.sh
      - name: Codecov
        run: |
          codecov -t $CODECOV_TOKEN
