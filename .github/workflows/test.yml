name: Test
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: 3.13
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            docker-compose-v2 \
            libpcre2-dev
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install python dependencies
        run: |
          uv sync --prerelease=allow --all-extras
          uv pip install --python .venv/bin/python codecov
      - name: Checking formatting with ruff
        run: uv run ruff check
      - name: Mypy check
        run: uv run mypy .
      - name: Run unit tests
        run: |
          scripts/run_unit_tests.sh
      - name: Run comprehensive test
        run: |
          scripts/run_comprehensive_test.sh
      - name: Codecov
        run: uv run codecov -t "$CODECOV_TOKEN"
